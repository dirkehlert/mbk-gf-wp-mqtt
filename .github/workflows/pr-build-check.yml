name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'tools/observer_host_tests.py'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'tools/observer_host_tests.py'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

jobs:
  observer-host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run observer host tests
        run: python tools/observer_host_tests.py

  build:
    runs-on: ubuntu-latest
    needs: observer-host-tests
    strategy:
      fail-fast: false
      matrix:
        environment:
          # Project target plus retained field/reference boards.
          - Heltec_Wireless_Paper_mqtt_observer
          - ThinkNode_M1_field_monitor
          - LilyGo_T-Echo_repeater
          - WioTrackerL1_repeater

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

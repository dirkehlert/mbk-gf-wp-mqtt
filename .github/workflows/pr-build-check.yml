name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # Project target: Heltec Wireless Paper field monitor.
          #
          # The retained reference board configs are kept available for manual
          # experiments, but this firmware has diverged from upstream's generic
          # simple_repeater and now depends on the Wireless Paper observer setup.
          - Heltec_Wireless_Paper_mqtt_observer

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
